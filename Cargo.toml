[package]
name = "cosmos-applet-systemd"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Cosmos Systemd applet for pinned units on the COSMIC panel"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", default-features = false, features = ["applet", "a11y", "dbus-config"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "rt-multi-thread"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
